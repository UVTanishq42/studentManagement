
<!DOCTYPE html>
<html>
<head>
<title>Event Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="script.js"></script>
<h2>Event Registration Form</h2>

<form id="form">
<input id="name" placeholder="Full Name" required><br>
<input id="email" type="email" placeholder="Email" required><br>
<input id="phone" placeholder="Phone Number"
pattern="[0-9]{10}" required><br>

<select id="gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select><br>

<input id="college" placeholder="College Name" required><br>

<select id="dept" required>
<option value="">Select Department</option>
<option>CSE</option>
<option>IT</option>
<option>ECE</option>
<option>EEE</option>
</select><br>

<select id="year" required>
<option value="">Year of Study</option>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select><br>

<select id="event" required>
<option value="">Select Event</option>
<option>Hackathon</option>
<option>Workshop</option>
<option>Technical Quiz</option>
</select><br>

<button type="submit">Register</button>
<button type="reset">Reset</button>
<h2>Student Search</h2>
</form>

<p id="result"></p>
</body>
</html>
